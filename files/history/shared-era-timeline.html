:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);

  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

  padding: 0;

  cursor: var(--cursor-interaction, pointer);

  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);

  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  background-color: var(--secondary);
  background-image:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;

  width: 14px;

  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:focus-visible {

  ];

  const laterItems = [
    { id: &#x27;chesterton&#x27;, start: 1874, end: 1936, date: &#x27;1874–1936&#x27;, title: &#x27;G. K. Chesterton&#x27;, summary: &#x27;A modern writer looking back: this course reads his poem on Lepanto and his biography of Aquinas.&#x27; },

  ];

  const allItems = [...events, ...people, ...works, ...laterItems];
  const byId = new Map(allItems.map(d =&gt; [d.id, d]));

  function svgEl(name, attrs = {}, text = &#x27;&#x27;) {
    const el = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; el.setAttribute(key, String(value)));
    if (text) el.textContent = text;
    return el;
  }

  function clear(svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
  }

  function scaleLinear(value, d0, d1, r0, r1) {
    return r0 + ((value - d0) / (d1 - d0)) * (r1 - r0);
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function estimateLabel(label, min = 72, max = 140) {
    return clamp(label.length * 6.15, min, max);
  }

  function pack(items, xAccessor, widthAccessor, left, right, gap = 8) {
    const rows = [];
    const placed = [];
    [...items].sort((a, b) =&gt; xAccessor(a) - xAccessor(b)).forEach(item =&gt; {
      const width = widthAccessor(item);
      const center = clamp(xAccessor(item), left + width / 2, right - width / 2);
      const start = center - width / 2;
      const end = center + width / 2;
      let row = rows.findIndex(last =&gt; start &gt; last + gap);
      if (row &lt; 0) {
        row = rows.length;
        rows.push(end);
      } else {
        rows[row] = end;
      }
      placed.push({ item, row, center, width });
    });
    return { placed, count: rows.length };
  }

  function itemColor(item) {
    if (item.shared || item.type === &#x27;shared&#x27;) return &#x27;var(--viz-series-3)&#x27;;
    if (item.type === &#x27;literature&#x27; || works.includes(item) || item.year) return &#x27;var(--viz-series-2)&#x27;;
    return &#x27;var(--viz-series-1)&#x27;;
  }

  function diamondPath(x, y, radius) {
    return `M ${x} ${y - radius} L ${x + radius} ${y} L ${x} ${y + radius} L ${x - radius} ${y} Z`;
  }

  function selectable(parent, item, label) {
    const link = svgEl(&#x27;a&#x27;, {
      href: &#x27;#timeline-detail&#x27;,
      &#x27;data-select-id&#x27;: item.id,
      &#x27;data-tooltip&#x27;: `${item.date} · ${item.title}`,
      &#x27;aria-label&#x27;: label || `${item.date}: ${item.title}`
    });
    parent.appendChild(link);
    return link;
  }

  function drawEra() {
    const svg = document.getElementById(&#x27;era-chart&#x27;);
    const width = Math.max(560, Math.round(svg.parentElement.getBoundingClientRect().width || 736));
    const left = 20;
    const right = width - 20;
    const x = year =&gt; scaleLinear(year, domain[0], domain[1], left, right);

    const coreEvents = events.filter(d =&gt; d.core);
    const eventPack = pack(coreEvents, d =&gt; x((d.start + (d.end || d.start)) / 2), d =&gt; estimateLabel(d.title), left, right, 10);
    const peoplePack = pack(people, d =&gt; x((d.start + d.end) / 2), d =&gt; Math.max(estimateLabel(`${d.title} · ${d.date}`, 92, 182), x(d.end) - x(d.start)), left, right, 14);
    const workPack = pack(works, d =&gt; x((d.start + d.end) / 2), d =&gt; Math.max(estimateLabel(d.title, 78, 142), estimateLabel(d.date, 90, 176)), left, right, 12);

    const eraY = 8;
    const eraH = 27;
    const ticksY = 53;
    const eventTop = 82;
    const eventAxisY = eventTop + eventPack.count * 37 + 12;
    const peopleTop = eventAxisY + 54;
    const peopleBottom = peopleTop + peoplePack.count * 35 + 12;
    const worksTop = peopleBottom + 47;
    const worksBottom = worksTop + workPack.count * 38 + 20;
    const height = worksBottom + 31;

    clear(svg);
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.setAttribute(&#x27;height&#x27;, height);

    const title = svgEl(&#x27;title&#x27;, { id: &#x27;era-chart-svg-title&#x27; }, &#x27;The World We Study, 1100 to 1616&#x27;);
    const desc = svgEl(&#x27;desc&#x27;, { id: &#x27;era-chart-svg-desc&#x27; }, &#x27;A proportional timeline aligning core historical events, important lifespans, and the composition dates of the major Literature 11 works. Select any labeled mark for a concise cross-course explanation.&#x27;);
    svg.append(title, desc);

    svg.appendChild(svgEl(&#x27;rect&#x27;, {
      x: left,
      y: eraY,
      width: right - left,
      height: height - eraY - 18,
      fill: &#x27;none&#x27;,
      stroke: &#x27;var(--border)&#x27;,
      &#x27;stroke-width&#x27;: 1,
      &#x27;data-chart-frame&#x27;: &#x27;&#x27;
    }));

    const eras = [
      { start: 1100, end: 1300, label: &#x27;High Middle Ages · c. 1100–1300&#x27;, color: &#x27;var(--viz-series-1)&#x27; },
      { start: 1300, end: 1450, label: &#x27;Crisis &amp; transition · c. 1300–1450&#x27;, color: &#x27;var(--viz-series-3)&#x27; },
      { start: 1450, end: 1620, label: &#x27;Renaissance &amp; Reformations · c. 1450–1620&#x27;, color: &#x27;var(--viz-series-2)&#x27; }
    ];

    eras.forEach(era =&gt; {
      svg.appendChild(svgEl(&#x27;rect&#x27;, {
        x: x(era.start), y: eraY, width: x(era.end) - x(era.start), height: eraH,
        fill: era.color, opacity: 0.12
      }));
      const center = (x(era.start) + x(era.end)) / 2;
      const fits = x(era.end) - x(era.start) &gt; 170;
      svg.appendChild(svgEl(&#x27;text&#x27;, {
        x: center, y: eraY + 18, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12, &#x27;font-weight&#x27;: 500
      }, fits ? era.label : era.label.split(&#x27; · &#x27;)[0]));
    });

    [1100, 1200, 1300, 1400, 1500, 1600].forEach(year =&gt; {
      svg.appendChild(svgEl(&#x27;line&#x27;, {
        x1: x(year), y1: eraY + eraH, x2: x(year), y2: height - 18,
        stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1, opacity: 0.62

      svg.appendChild(svgEl(&#x27;text&#x27;, {
        x: x(year), y: ticksY, &#x27;text-anchor&#x27;: year === 1100 ? &#x27;start&#x27; : &#x27;middle&#x27;,
        fill: &#x27;var(--muted-foreground)&#x27;, &#x27;font-size&#x27;: 12
      }, String(year)));
    });

    svg.appendChild(svgEl(&#x27;text&#x27;, { x: left, y: eventTop - 13, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12, &#x27;font-weight&#x27;: 500 }, &#x27;HISTORY · events&#x27;));
    svg.appendChild(svgEl(&#x27;line&#x27;, { x1: left, y1: eventAxisY, x2: right, y2: eventAxisY, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 2 }));

    events.filter(d =&gt; !d.core).forEach(item =&gt; {
      const mid = x((item.start + (item.end || item.start)) / 2);
      const link = selectable(svg, item);
      if (item.end) {

      link.appendChild(svgEl(&#x27;circle&#x27;, { cx: mid, cy: eventAxisY, r: 4.5, fill: &#x27;var(--viz-series-1)&#x27;, opacity: 0.72 }));

    eventPack.placed.forEach(({ item, row, center }) =&gt; {
      const markX = x((item.start + (item.end || item.start)) / 2);

      const color = itemColor(item);
      const link = selectable(svg, item);
      link.appendChild(svgEl(&#x27;path&#x27;, {
        d: `M ${markX} ${eventAxisY - 7} L ${markX} ${labelY + 26} L ${center} ${labelY + 26}`,
        fill: &#x27;none&#x27;, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1
      }));
      if (item.end) {
        link.appendChild(svgEl(&#x27;line&#x27;, { x1: x(item.start), y1: eventAxisY, x2: x(item.end), y2: eventAxisY, stroke: color, &#x27;stroke-width&#x27;: 7 }));
      }
      if (item.shared) {
        link.appendChild(svgEl(&#x27;path&#x27;, { d: diamondPath(markX, eventAxisY, 6), fill: color, &#x27;data-mark-id&#x27;: item.id }));
      } else {
        link.appendChild(svgEl(&#x27;circle&#x27;, { cx: markX, cy: eventAxisY, r: 6, fill: color, &#x27;data-mark-id&#x27;: item.id }));
      }
      const text = svgEl(&#x27;text&#x27;, { x: center, y: labelY + 10, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12 });
      text.appendChild(svgEl(&#x27;tspan&#x27;, { x: center, dy: 0, fill: &#x27;var(--muted-foreground)&#x27; }, item.date));
      text.appendChild(svgEl(&#x27;tspan&#x27;, { x: center, dy: 15, &#x27;font-weight&#x27;: 500 }, item.title));
      link.appendChild(text);
    });

    svg.appendChild(svgEl(&#x27;text&#x27;, { x: left, y: peopleTop - 14, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12, &#x27;font-weight&#x27;: 500 }, &#x27;PEOPLE · figures and authors&#x27;));
    peoplePack.placed.forEach(({ item, row, center }) =&gt; {
      const y = peopleTop + row * 35 + 18;
      const color = itemColor(item);
      const link = selectable(svg, item);
      link.appendChild(svgEl(&#x27;line&#x27;, { x1: x(item.start), y1: y, x2: x(item.end), y2: y, stroke: color, &#x27;stroke-width&#x27;: 7, &#x27;data-mark-id&#x27;: item.id }));
      link.appendChild(svgEl(&#x27;circle&#x27;, { cx: x(item.start), cy: y, r: 3.5, fill: color }));
      link.appendChild(svgEl(&#x27;circle&#x27;, { cx: x(item.end), cy: y, r: 3.5, fill: color }));
      const text = svgEl(&#x27;text&#x27;, { x: center, y: y - 8, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12 });
      text.appendChild(svgEl(&#x27;tspan&#x27;, { &#x27;font-weight&#x27;: 500 }, item.title));
      text.appendChild(svgEl(&#x27;tspan&#x27;, { fill: &#x27;var(--muted-foreground)&#x27; }, ` · ${item.date}`));
      link.appendChild(text);

    svg.appendChild(svgEl(&#x27;text&#x27;, { x: left, y: worksTop - 14, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12, &#x27;font-weight&#x27;: 500 }, &#x27;LITERATURE · when the works entered the world&#x27;));
    workPack.placed.forEach(({ item, row, center }) =&gt; {
      const y = worksTop + row * 38 + 18;
      const link = selectable(svg, item);
      link.appendChild(svgEl(&#x27;line&#x27;, { x1: x(item.start), y1: y, x2: x(item.end), y2: y, stroke: &#x27;var(--viz-series-2)&#x27;, &#x27;stroke-width&#x27;: 6, &#x27;data-mark-id&#x27;: item.id }));
      const points = item.points || [item.setting || (item.start + item.end) / 2];

      const text = svgEl(&#x27;text&#x27;, { x: center, y: y - 8, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, fill: &#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;: 12 });
      text.appendChild(svgEl(&#x27;tspan&#x27;, { &#x27;font-weight&#x27;: 500 }, item.title));

  function drawLater() {
    const svg = document.getElementById(&#x27;later-chart&#x27;);
    const width = Math.max(320, Math.round(svg.parentElement.getBoundingClientRect().width || 736));
    const height = 188;
    const left = 20;
    const right = width - 20;
    const x = year =&gt; scaleLinear(year, 1870, 2000, left, right);
    clear(svg);
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.setAttribute(&#x27;height&#x27;, height);
    svg.append(svgEl(&#x27;title&#x27;, { id: &#x27;later-svg-title&#x27; }, &#x27;Later writers looking back&#x27;), svgEl(&#x27;desc&#x27;, { id: &#x27;later-svg-desc&#x27; }, &#x27;A separate modern axis for Chesterton and Bolt, with their works pointing back to Aquinas, More, and Lepanto.&#x27;));

    svg.appendChild(svgEl(&#x27;rect&#x27;, { x: left, y: 8, width: right - left, height: 162, fill: &#x27;none&#x27;, stroke: &#x27;var(--border)&#x27;, &#x27;stroke-width&#x27;: 1, &#x27;data-chart-frame&#x27;: &#x27;&#x27; }));

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

        .split(/\s+/)

    clearOpenTimeout();

    tooltip?.remove();

      .then(({ x, y }) =&gt; {

      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    });

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

    if (event.key === &quot;Escape&quot;) {

    }

  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);

      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

  const beginWatching = () => {
    fitToContent();
    const doc = frame.contentDocument;
    if (doc && "ResizeObserver" in window) {
      new ResizeObserver(fitToContent).observe(doc.documentElement);
    }
    window.addEventListener("resize", fitToContent, { passive: true });
  };

  frame.addEventListener("load", beginWatching, { once: true });
  if (frame.contentDocument?.readyState === "complete") beginWatching();
})();
</script>
